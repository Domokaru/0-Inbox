name: Build Zero Inbox Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Verify Signing Keystore & Print Fingerprint
        working-directory: android/app
        run: |
          echo "=== VERIFYING SIGNING KEYSTORE ==="
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey || true

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK Generated
        run: |
          ls -la android/app/build/outputs/apk/debug/
          cp android/app/build/outputs/apk/debug/app-debug.apk ./ZeroInbox-v1.0.1-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroInbox-v1.0.1-debug-APK
          path: ./ZeroInbox-v1.0.1-debug.apk
          retention-days: 90

      - name: Create Release for Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./ZeroInbox-v1.0.1-debug.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## Zero Inbox Android APK
            
            Installable APK generated by GitHub Actions.
            
            - **File:** `ZeroInbox-v1.0.1-debug.apk`
            - **Version:** `1.0.1` (versionCode 2)
            - **Package Name:** `com.example.zeroinbox`
            - **SHA-1 Fingerprint:** `87:D1:D4:79:4B:29:DD:C4:78:4A:D3:C7:AD:02:E7:E6:51:FB:41:FB`
            - **Target Android SDK:** 34 (Android 14)
            - **Minimum Android SDK:** 26 (Android 8.0 Oreo)
            - **Features:** 4-Way Swipe Mail Stack, Direct Custom Label Dialog, Gmail REST API, Undo Snackbars, Retro Neon Dark & Pastel Themes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
